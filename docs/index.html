<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ứng dụng Quản lý Thời Gian</title>

  <!-- Kiểm tra đăng nhập -->
  <script>
    if (!localStorage.getItem("isLogin")) {
      window.location.href = "login.html";
    }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <h1>⏰ Quản lý Thời Gian</h1>
  <p id="currentTime" class="time"></p>
  <button onclick="logout()" class="logout-btn">Đăng xuất</button>
</header>

<main class="container">

  <!-- TASK -->
  <section class="card">
    <h2>📋 Quản lý công việc</h2>

    <input type="text" id="task" placeholder="Nhập công việc">
    <select id="priority">
      <option value="Cao">🔥 Cao</option>
      <option value="Trung bình">⚡ Trung bình</option>
      <option value="Thấp">🌱 Thấp</option>
    </select>
    <input type="datetime-local" id="endTime">
    <button onclick="addTask()">Thêm</button>

    <ul id="taskList"></ul>

    <div class="progress-container">
      <div id="progressBar"></div>
    </div>
    <p id="progressText">0% hoàn thành</p>
  </section>

  <!--THÊM QUẢN LÝ MỤC TIÊU DÀI HẠN-->
  <section class="card">
  <h2>🎯 Quản lý mục tiêu dài hạn</h2>

  <input type="text" id="goalName" placeholder="Tên mục tiêu (VD: Học xong Python)">
  <textarea id="goalDesc" placeholder="Mô tả mục tiêu (có thể để trống)"></textarea>

  <label>Bắt đầu:</label>
  <input type="date" id="goalStart">

  <label>Kết thúc:</label>
  <input type="date" id="goalEnd">

  <button onclick="addGoal()">Thêm mục tiêu</button>

  <ul id="goalList"></ul>
</section>


  <!-- POMODORO -->
  <section class="card">
    <h2>⏱ Pomodoro</h2>
    <p id="timer">25:00</p>
    <button onclick="startPomodoro()">Bắt đầu</button>
  </section>

</main>

<script src="js/auth.js"></script>
<script src="js/script.js"></script>

</body>
</html>
